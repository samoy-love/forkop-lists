name: update-lists

on:
  schedule:
    # GitHub's minimum interval. Note: scheduled runs are best-effort and are
    # frequently delayed by 10-30 min under load, so treat 5 min as a floor,
    # not a guarantee. AWS ranges change rarely, so this is acceptable.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build lists
        run: bash scripts/build-lists.sh

      - name: Commit when changed
        run: |
          if [ -n "$(git status --porcelain lists/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lists/
            git commit -m "lists: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "no changes"
          fi
